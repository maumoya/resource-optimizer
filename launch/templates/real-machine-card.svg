<svg xmlns="http://www.w3.org/2000/svg" width="760" height="240" viewBox="0 0 760 240" role="img" aria-label="{{freed_pct}} of the disk freed on a real Mac mini: free space went from {{free_before_pct}} to {{free_after_pct}}, {{freed_gb}} of {{disk_size}}, every delete approved by the user">
  <rect x="1.5" y="1.5" width="757" height="237" rx="18" fill="#0d1117" stroke="#2da44e" stroke-width="2"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="180" y="132" text-anchor="middle" font-size="120" font-weight="800" fill="#2da44e">{{freed_pct}}</text>
    <text x="180" y="170" text-anchor="middle" font-size="20" font-weight="600" fill="#2da44e">of the disk freed</text>
    <text x="180" y="196" text-anchor="middle" font-size="14" fill="#8b949e">{{freed_gb}} of {{disk_size}} · real Mac mini</text>

    <text x="370" y="62" font-size="15" fill="#c9d1d9">Free space before</text>
    <text x="730" y="62" text-anchor="end" font-size="15" font-weight="700" fill="#f85149">{{free_before_pct}}</text>
    <rect x="370" y="72" width="360" height="22" rx="6" fill="#21262d"/>
    <rect x="370" y="72" width="14" height="22" rx="6" fill="#f85149"/>

    <text x="370" y="132" font-size="15" fill="#c9d1d9">Free space after</text>
    <text x="730" y="132" text-anchor="end" font-size="15" font-weight="700" fill="#2da44e">{{free_after_pct}}</text>
    <rect x="370" y="142" width="360" height="22" rx="6" fill="#21262d"/>
    <rect x="370" y="142" width="90" height="22" rx="6" fill="#2da44e"/>

    <text x="370" y="200" font-size="14" fill="#8b949e">{{approved_pct}} of deletes approved by you</text>
    <text x="370" y="220" font-size="14" fill="#8b949e">0 files deleted by the agent on its own</text>
  </g>
</svg>
