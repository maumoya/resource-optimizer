# Lint: keyless checks on every PR (frontmatter, JSON, eval layout, risky patterns). No API key needed.
name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: read-all

jobs:
  lint:
    name: Lint skill
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint
        run: bash scripts/lint_skill.sh .

      - name: Published numbers in sync
        run: python3 -I launch/sync.py check .

  action:
    name: Self-test the action
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Passing input
        id: pass
        uses: ./
        with:
          min-free-percent: 0

      - name: Output is a percent
        env:
          PCT: ${{ steps.pass.outputs.free-percent }}
        run: '[[ "$PCT" =~ ^[0-9]+$ ]] && [ "$PCT" -le 100 ]'

      - name: Failing input
        id: fail
        continue-on-error: true
        uses: ./
        with:
          min-free-percent: 101

      - name: Failing input must fail
        env:
          OUTCOME: ${{ steps.fail.outcome }}
        run: '[ "$OUTCOME" = failure ]'
